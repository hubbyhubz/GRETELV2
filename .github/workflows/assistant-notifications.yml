name: Assistant Notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      notify_run_url:
        description: "Override NOTIFY_RUN_URL for manual runs"
        required: false
        type: string

jobs:
  notify-run:
    runs-on: ubuntu-latest
    steps:
      - name: Call notify-run endpoint
        env:
          NOTIFY_RUN_URL: ${{ secrets.NOTIFY_RUN_URL }}
          NOTIFY_RUN_SECRET: ${{ secrets.NOTIFY_RUN_SECRET }}
        run: |
          INPUT_URL="${{ github.event.inputs.notify_run_url }}"
          EFFECTIVE_URL="$NOTIFY_RUN_URL"
          if [ -n "$INPUT_URL" ]; then
            EFFECTIVE_URL="$INPUT_URL"
          fi

          if [ -z "$EFFECTIVE_URL" ]; then
            echo "::warning title=Assistant Notifications skipped::Missing NOTIFY_RUN_URL secret (or workflow_dispatch input notify_run_url)."
            exit 0
          fi

          if [ -n "$NOTIFY_RUN_SECRET" ]; then
            curl -fsS -H "Authorization: Bearer $NOTIFY_RUN_SECRET" "$EFFECTIVE_URL"
          else
            curl -fsS "$EFFECTIVE_URL"
          fi
